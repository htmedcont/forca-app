/* ── Session detail ── */
function openSessionDetail(sessionId) {
  if (!sessionId) return;
  const data = load();
  const sess = data.history.find(s => s.id === sessionId);
  if (!sess) return;

  const prevSess = [...data.history]
    .filter(s => s.planId === sess.planId && s.id !== sessionId)
    .sort((a,b) => new Date(a.date)-new Date(b.date))
    .pop();

  let body = `<p style="font-size:12px;color:var(--text-sec);margin-bottom:8px">
    ${fmtDateLong(sess.date)} · ${sess.duration ? fmtDur(sess.duration) : '—'}</p>`;

  // Volume total
  let vol = 0;
  sess.exercises.forEach(ex => ex.sets.forEach(s => vol += s.load*s.reps));
  body += `<p style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:16px">Volume total: ${fmtVol(vol)}</p>`;

  sess.exercises.forEach(ex => {
    const prevEx = prevSess ? prevSess.exercises.find(e => e.exerciseId === ex.exerciseId) : null;
    body += `<div class="det-ex">
    <div class="det-ex-name">
      <span>${ex.name}</span>
      <button class="chart-btn" onclick="openExerciseChart('${ex.exerciseId}','${esc(ex.name)}')" title="Ver evolução">📈</button>
    </div>
    <div class="det-sets">`;

    ex.sets.forEach((set, i) => {
      let cmp = '';
      if (prevEx && prevEx.sets[i]) {
        const dL = set.load - prevEx.sets[i].load;
        const dR = set.reps - prevEx.sets[i].reps;
        if      (dL > 0) cmp = `<span class="cmp-tag cmp-better">+${dL}kg</span>`;
        else if (dL < 0) cmp = `<span class="cmp-tag cmp-worse">${dL}kg</span>`;
        else if (dR > 0) cmp = `<span class="cmp-tag cmp-better">+${dR}r</span>`;
        else if (dR < 0) cmp = `<span class="cmp-tag cmp-worse">${dR}r</span>`;
        else             cmp = `<span class="cmp-tag cmp-same">=</span>`;
      }
      body += `<div class="det-set">
        <span class="set-load">${set.load}kg</span>
        <span class="set-sep">×</span>
        <span class="set-reps">${set.reps}</span>${cmp}
      </div>`;
    });

    body += `</div>`;
    if (ex.note) body += `<div style="font-size:11px;color:var(--text-muted);margin-top:6px;font-style:italic">"${ex.note}"</div>`;
    body += `</div>`;
  });

  if (prevSess) {
    body += `<div style="margin-top:12px;padding:10px 12px;background:var(--surface2);border-radius:var(--radius-sm);font-size:11px;color:var(--text-sec)">
      Comparado com: ${fmtDate(prevSess.date)}</div>`;
  }

  body += `<div style="margin-top:18px">
    <button class="btn btn-danger btn-sm" onclick="deleteSession('${sessionId}')">🗑 Apagar este treino</button>
  </div>`;

  openModal(sess.name, body);
}

function openExerciseChart(exId, exName) {
  const data = load();
  const points = [];
  [...data.history].sort((a,b) => new Date(a.date)-new Date(b.date)).forEach(sess => {
    const ex = sess.exercises.find(e => e.exerciseId === exId);
    if (!ex) return;
    const maxLoad = Math.max(...ex.sets.map(s => s.load));
    points.push({ date: new Date(sess.date), load: maxLoad, vol: ex.sets.reduce((a,s)=>a+s.load*s.reps,0), label: fmtDate(sess.date) });
  });

  let body = '';
  if (points.length < 2) {
    body = `<p style="color:var(--text-sec);font-size:13px">Mínimo 2 sessões para exibir o gráfico.</p>`;
  } else {

/* ── Cálculos corporais ── */
function calcBodyStats(s) {
  const w  = s.weight;  // kg
  const h  = s.height;  // cm
  const a  = s.age;     // anos
  const sx = s.sex;     // 'M' | 'F'

  if (!w || !h || w < 30 || h < 100) return null;

  const hm = h / 100;  // metros

  // IMC
  const imc = w / (hm * hm);

  // Classificação IMC
  let imcClass, imcColor;
  if      (imc < 17)    { imcClass = 'Magreza grave';     imcColor = '#4DFFA0'; }
  else if (imc < 18.5)  { imcClass = 'Abaixo do peso';    imcColor = '#4DFFA0'; }
  else if (imc < 25)    { imcClass = 'Peso normal ✓';     imcColor = '#C8F500'; }
  else if (imc < 30)    { imcClass = 'Sobrepeso';          imcColor = '#FFB347'; }
  else if (imc < 35)    { imcClass = 'Obesidade Grau I';   imcColor = '#FF7A00'; }
  else if (imc < 40)    { imcClass = 'Obesidade Grau II';  imcColor = '#FF4D4D'; }
  else                   { imcClass = 'Obesidade Grau III'; imcColor = '#FF4D4D'; }

  // Peso ideal: faixa onde IMC = 18.5 a 24.9
  const pesoIdealMin = +(18.5 * hm * hm).toFixed(1);
  const pesoIdealMax = +(24.9 * hm * hm).toFixed(1);
  const pesoIdealMid = +((pesoIdealMin + pesoIdealMax) / 2).toFixed(1);

  // Diferença para o peso ideal MÁXIMO (IMC 24.9)
  const diff = +(w - pesoIdealMax).toFixed(1);

  // TMB — Mifflin-St Jeor
  let tmb;
  if (a && a > 0) {
    if (sx === 'M') tmb = Math.round(10*w + 6.25*h - 5*a + 5);
    else            tmb = Math.round(10*w + 6.25*h - 5*a - 161);
  } else {
    // sem idade: usa fórmula simplificada
    tmb = Math.round(sx === 'M' ? 10*w + 6.25*h - 200 : 10*w + 6.25*h - 361);
  }

  // TDEE estimativas por nível de atividade
  const tdeeLight    = Math.round(tmb * 1.375);
  const tdeeModerate = Math.round(tmb * 1.55);
  const tdeeActive   = Math.round(tmb * 1.725);

  // Posição na régua do IMC (0–100%)
  // IMC de 15 a 45 → 100%
  const imcPct = Math.min(100, Math.max(0, ((imc - 15) / 30) * 100));

  // Metas por objetivo
  const goal = s.goalType || 'lose';
  let realWeek, realMonth, aggrWeek, aggrMonth, goalLabel, goalDir;

  if (goal === 'lose') {
    realWeek  = -0.5; realMonth  = -2.0;
    aggrWeek  = -1.0; aggrMonth  = -4.0;
    goalLabel = 'Perder peso'; goalDir = '↓';
  } else if (goal === 'gain') {
    realWeek  = +0.25; realMonth  = +1.0;
    aggrWeek  = +0.5;  aggrMonth  = +2.0;
    goalLabel = 'Ganhar massa'; goalDir = '↑';
  } else {
    realWeek  = 0; realMonth  = 0;
    aggrWeek  = 0; aggrMonth  = 0;
    goalLabel = 'Manter peso'; goalDir = '=';
  }

  // Estimativa de quando chega ao peso ideal
  const toIdeal = Math.abs(diff);
  const weeksReal = realWeek !== 0 ? Math.ceil(toIdeal / Math.abs(realWeek)) : null;
  const weeksAggr = aggrWeek !== 0 ? Math.ceil(toIdeal / Math.abs(aggrWeek)) : null;

  return {
    imc, imcClass, imcColor, imcPct,
    pesoIdealMin, pesoIdealMax,
    diff, tmb, tdeeLight, tdeeModerate, tdeeActive,
    goal, goalLabel, goalDir,
    realWeek, realMonth, aggrWeek, aggrMonth,
    weeksReal, weeksAggr,
  };
}

  panel.innerHTML = `

function changeSetting(key, delta) {
  const s = loadSettings();
  if (key === 'restTime') {
    s.restTime = Math.max(15, Math.min(300, s.restTime + delta));
    document.getElementById('cfg-rest').textContent = s.restTime + 's';
  }
  if (key === 'progressStep') {
    s.progressStep = Math.max(0.5, Math.min(10, +(s.progressStep + delta).toFixed(1)));
    document.getElementById('cfg-step').textContent = s.progressStep + 'kg';
  }
  saveSettings(s);
}

async function toggleNotif(enabled) {
  if (enabled) {
    if (!('Notification' in window)) {
      toast('⚠ Notificações não suportadas');
      document.getElementById('cfg-notif').checked = false;
      return;
    }
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') {
      toast('Permissão negada para notificações');
      document.getElementById('cfg-notif').checked = false;
      return;
    }
  }
  const s = loadSettings();
  s.notifEnabled = enabled;
  saveSettings(s);
  toast(enabled ? '🔔 Lembrete ativado!' : '🔕 Lembrete desativado');
  if (enabled) scheduleNotif(s.notifTime);
}

function saveNotifTime(time) {
  const s = loadSettings();
  s.notifTime = time;
  saveSettings(s);
  if (s.notifEnabled) scheduleNotif(time);
}

function scheduleNotif(timeStr) {
  const [h, m] = timeStr.split(':').map(Number);
  const now    = new Date();
  const target = new Date();
  target.setHours(h, m, 0, 0);
  if (target <= now) target.setDate(target.getDate() + 1);
  const diff = target - now;
  clearTimeout(window._notifTimeout);
  window._notifTimeout = setTimeout(() => {
    triggerNotifIfEnabled('Hora do treino! 💪 Bora arrasar hoje.');
    scheduleNotif(timeStr); // re-agendar amanhã
  }, diff);
}

function triggerNotifIfEnabled(msg) {
  const s = loadSettings();
  if (s.notifEnabled && Notification.permission === 'granted') {
    new Notification('FORÇA 💪', { body: msg, icon: '' });
  }
}

/* ── Export / Import ── */
function exportData() {
  const data     = load();
  const settings = loadSettings();
  const prs      = loadPRs();
  const backup   = {
    version:  2,
    exported: new Date().toISOString(),
    plans:    data.plans,
    history:  data.history,
    settings: settings,
    prs:      prs,
  };
  const blob = new Blob([JSON.stringify(backup, null, 2)], { type:'application/json' });
  const a    = document.createElement('a');
  a.href     = URL.createObjectURL(blob);
  a.download = `forca-backup-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
  toast('📤 Backup exportado!');
}

function handleImport(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const bk = JSON.parse(e.target.result);
      if (bk.plans)    savePlans(bk.plans);
      if (bk.history)  saveHistory(bk.history);
      if (bk.settings) saveSettings(bk.settings);
      if (bk.prs)      savePRs(bk.prs);
      toast('📥 Dados importados com sucesso!');
      renderProfile();
    } catch {
      toast('⚠ Arquivo inválido');
    }
    input.value = '';
  };
  reader.readAsText(file);
}

/* ================================================================
   WEIGHT GAME — Acompanhamento de peso gamificado
================================================================ */

/* ── Storage helpers ── */
function loadWeight() {
  return JSON.parse(localStorage.getItem(KEY.WEIGHT) || 'null') || {
    goal:        null,
    startWeight: null,
    entries:     [],   // [{ date:'2024-01-15', weight:85.2 }]
  };
}
function saveWeight(d) { localStorage.setItem(KEY.WEIGHT, JSON.stringify(d)); }

/* Data de hoje no formato YYYY-MM-DD */
function todayStr() { return new Date().toISOString().split('T')[0]; }

/* Entrada de hoje (se existir) */
function todayEntry(data) { return data.entries.find(e => e.date === todayStr()) || null; }

/* Entrada mais recente (excluindo hoje se quiser) */
function lastEntry(data, excludeToday = false) {
  const entries = excludeToday
    ? data.entries.filter(e => e.date !== todayStr())
    : data.entries;
  if (!entries.length) return null;
  return [...entries].sort((a,b) => b.date.localeCompare(a.date))[0];
}

/* Streak: dias consecutivos com registro */
function weightStreak(data) {
  if (!data.entries.length) return 0;
  const dates = new Set(data.entries.map(e => e.date));
  let streak = 0;
  const d = new Date();
  // Se não pesou hoje, começa de ontem
  if (!dates.has(todayStr())) d.setDate(d.getDate() - 1);
  while (dates.has(d.toISOString().split('T')[0])) {
    streak++;
    d.setDate(d.getDate() - 1);
  }
  return streak;
}

/* Próximo marco de perda/ganho (a cada 1kg completo) */
function nextMilestone(data) {
  if (!data.startWeight || !data.goal || !data.entries.length) return null;
  const curr    = lastEntry(data)?.weight;
  if (!curr) return null;
  const losing  = data.goal < data.startWeight;
  const totalDiff = Math.abs(data.startWeight - data.goal);
  const doneDiff  = losing
    ? Math.max(0, data.startWeight - curr)
    : Math.max(0, curr - data.startWeight);

  const nextKg = Math.floor(doneDiff) + 1;
  if (nextKg > totalDiff) return null;
  const remaining = nextKg - doneDiff;
  return { nextKg, remaining: +remaining.toFixed(1), losing };
}

/* ── Cartão de jornada ── */
function buildJourneyCard(data, te, streak) {
  const curr  = (te || lastEntry(data))?.weight;
  if (!curr) return '';

  const start  = data.startWeight;
  const goal   = data.goal;
  const losing = goal < start;
  const total  = Math.abs(start - goal);
  const done   = losing
    ? Math.max(0, Math.min(total, start - curr))
    : Math.max(0, Math.min(total, curr - start));
  const pct    = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
  const left   = +(Math.abs(goal - curr)).toFixed(1);
  const reached= losing ? curr <= goal : curr >= goal;

  const fillCls = reached ? 'done' : losing ? 'losing' : 'gaining';
  const avatarPct = Math.min(94, Math.max(2, pct * 0.94));

  // Qual emoji usar
  const avatarEmoji = pct >= 100 ? '🏆' : pct >= 75 ? '🔥' : pct >= 50 ? '😤' : pct >= 25 ? '💪' : '🏃';

  // Marco
  const ms = nextMilestone(data);

  return `
  <div class="wg-journey">
    <div class="wg-journey-header">
      <span class="wg-journey-title">${losing ? '📉 Jornada de emagrecimento' : '📈 Jornada de ganho de massa'}</span>
      <span class="wg-pct-badge">${pct}%</span>
    </div>

    <!-- Avatar animado -->
    <div class="wg-avatar-track">
      <div class="wg-avatar" style="left:${avatarPct}%">${avatarEmoji}</div>
      <div class="wg-flag">🏁</div>
    </div>

    <!-- Barra de progresso -->
    <div class="wg-bar-wrap">
      <div class="wg-bar-bg">
        <div class="wg-bar-fill ${fillCls}" style="width:${pct}%"></div>
      </div>
      <div class="wg-bar-labels">
        <span>${start}kg</span>
        <span>${goal}kg ⛳</span>
      </div>
    </div>

    <!-- Stats -->
    <div class="wg-stats" style="margin-top:14px">
      <div class="wg-stat">
        <div class="wg-stat-val" style="color:var(--accent)">${curr}kg</div>
        <div class="wg-stat-lbl">Hoje</div>
      </div>
      <div class="wg-stat">
        <div class="wg-stat-val" style="color:${reached ? 'var(--success)' : 'var(--text)'}">${reached ? '✓' : left+'kg'}</div>
        <div class="wg-stat-lbl">${reached ? 'Meta!' : 'Faltam'}</div>
      </div>
      <div class="wg-stat">
        <div class="wg-stat-val" style="color:${streak>=7?'var(--warning)':streak>=3?'var(--accent)':'var(--text)'}">${streak}${streak>=3?'🔥':''}</div>
        <div class="wg-stat-lbl">Dias seguidos</div>
      </div>
    </div>

    ${reached
      ? `<div class="wg-milestone done">🏆 META ATINGIDA! Parabéns, você chegou lá!</div>`
      : ms ? `<div class="wg-milestone">🎯 Próximo marco: −${ms.nextKg}kg total · faltam ${ms.remaining}kg</div>` : ''
    }
  </div>`;
}

/* ── Gráfico de peso ── */
function buildWeightChart(data) {
  const sorted = [...data.entries]
    .sort((a,b) => a.date.localeCompare(b.date))
    .slice(-30); // últimos 30 dias

  if (sorted.length < 2) return '';

  const points = sorted.map(e => ({
    label: fmtDate(e.date+'T12:00:00'),
    weight: e.weight,
  }));

  const vals = points.map(p => p.weight);
  const minV = Math.min(...vals) - 0.5;
  const maxV = Math.max(...vals) + 0.5;

  // Adiciona linha de meta
  const goalLine = data.goal;

  const W = 320, H = 110;
  const PAD = { t:14, r:12, b:26, l:44 };
  const iW = W - PAD.l - PAD.r;
  const iH = H - PAD.t - PAD.b;
  const toX = i => PAD.l + (i / (points.length - 1)) * iW;
  const toY = v => PAD.t + iH - ((v - minV) / (maxV - minV)) * iH;

  const linePts = points.map((p,i) => `${toX(i)},${toY(p.weight)}`).join(' ');
  const areaD   = `M${toX(0)},${toY(points[0].weight)} `
    + points.map((p,i) => `L${toX(i)},${toY(p.weight)}`).join(' ')
    + ` L${toX(points.length-1)},${PAD.t+iH} L${toX(0)},${PAD.t+iH} Z`;

  // Grid Y (3 linhas)
  let grids = '';
  for (let i = 0; i <= 2; i++) {
    const v = minV + ((maxV - minV) / 2) * i;
    const y = toY(v);
    grids += `<line x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>`;
    grids += `<text x="${PAD.l-4}" y="${y+4}" text-anchor="end" font-size="9" fill="var(--text-muted)" font-family="inherit">${v.toFixed(1)}</text>`;
  }

  // Linha de meta
  let goalSvg = '';
  if (goalLine && goalLine >= minV && goalLine <= maxV) {
    const gy = toY(goalLine);
    goalSvg = `
    <line x1="${PAD.l}" y1="${gy}" x2="${W-PAD.r}" y2="${gy}" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
    <text x="${W-PAD.r+2}" y="${gy+4}" font-size="9" fill="var(--accent)" font-family="inherit" font-weight="700">⛳</text>`;
  }

  // Dots
  let dots = '';
  points.forEach((p, i) => {
    const x = toX(i), y = toY(p.weight);
    const isFirst = i === 0, isLast = i === points.length-1;
    const isMin = p.weight === Math.min(...vals), isMax = p.weight === Math.max(...vals);
    if (isFirst || isLast || isMin || isMax) {
      dots += `<circle cx="${x}" cy="${y}" r="4" fill="var(--accent)" stroke="var(--bg)" stroke-width="2"/>`;
      const anchor = i === 0 ? 'start' : i === points.length-1 ? 'end' : 'middle';
      dots += `<text x="${x}" y="${y-8}" text-anchor="${anchor}" font-size="9" fill="var(--accent)" font-weight="700" font-family="inherit">${p.weight}</text>`;
    }
  });

  // X labels
  const xl = `
  <text x="${toX(0)}" y="${H-4}" text-anchor="start" font-size="8" fill="var(--text-muted)" font-family="inherit">${points[0].label}</text>
  <text x="${toX(points.length-1)}" y="${H-4}" text-anchor="end" font-size="8" fill="var(--text-muted)" font-family="inherit">${points[points.length-1].label}</text>`;

  return `
  <div class="wg-chart-wrap">
    <div class="wg-chart-title">📉 Últimos ${points.length} registros</div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:${H}px;overflow:visible">
      <defs>
        <linearGradient id="wgGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.2"/>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0.01"/>
        </linearGradient>
      </defs>
      ${grids}
      ${goalSvg}
      <path d="${areaD}" fill="url(#wgGrad)"/>
      <polyline points="${linePts}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${dots}
      ${xl}
    </svg>
  </div>`;
}

/* ── Registrar peso ── */
function logWeight() {
  const input = document.getElementById('wg-input');
  const val   = parseFloat(input?.value);
  if (!val || val < 30 || val > 300) { toast('⚠ Peso inválido'); return; }

  const data  = loadWeight();
  const today = todayStr();
  const prev  = todayEntry(data);

  // Se não tem peso inicial, usa o primeiro registro
  if (!data.startWeight) {
    data.startWeight = val;
  }

  // Upsert entry de hoje
  const idx = data.entries.findIndex(e => e.date === today);
  if (idx >= 0) data.entries[idx].weight = val;
  else          data.entries.push({ date: today, weight: val });

  saveWeight(data);

  // Checa conquistas
  checkWeightAchievements(data, val, prev?.weight);

  toast(prev ? '✏️ Peso atualizado!' : '✓ Peso registrado!');
  renderWeight();
}

/* Input em tempo real — atualiza diff */
function wgInputChanged(val) {
  const data = loadWeight();
  const le   = lastEntry(data, true);
  const num  = parseFloat(val);
  const diff = document.getElementById('wg-diff');
  if (!diff) return;
  if (!num || !le) return;
  const d = +(num - le.weight).toFixed(1);
  if      (d > 0) diff.innerHTML = `<span class="wg-diff-pos">▲ +${d}kg desde ontem</span>`;
  else if (d < 0) diff.innerHTML = `<span class="wg-diff-neg">▼ ${d}kg desde ontem</span>`;
  else             diff.innerHTML = `<span class="wg-diff-zero">= igual ao último registro</span>`;
}

/* ── Conquistas ── */
function checkWeightAchievements(data, newWeight, prevWeight) {
  if (!data.goal || !data.startWeight) return;

  const losing  = data.goal < data.startWeight;
  const total   = Math.abs(data.startWeight - data.goal);
  const done    = losing
    ? Math.max(0, data.startWeight - newWeight)
    : Math.max(0, newWeight - data.startWeight);

  // Meta atingida
  const reached = losing ? newWeight <= data.goal : newWeight >= data.goal;
  if (reached) {
    showWeightCelebration('🏆', 'META ATINGIDA!', `Você chegou em ${newWeight}kg. Incrível!`);
    return;
  }

  // Marcos de cada 1kg
  if (prevWeight !== undefined && prevWeight !== null) {
    const prevDone = losing
      ? Math.max(0, data.startWeight - prevWeight)
      : Math.max(0, prevWeight - data.startWeight);
    const prevKg = Math.floor(prevDone);
    const currKg = Math.floor(done);
    if (currKg > prevKg && currKg > 0) {
      const emoji = currKg >= 5 ? '🔥' : '⭐';
      showWeightCelebration(emoji, `${currKg}kg ${losing?'perdidos':'ganhos'}!`, `Continue assim, você está arrasando!`);
    }
  }

  // Streak especial
  const streak = weightStreak(data);
  if (streak === 7)  showWeightCelebration('🔥', '7 dias seguidos!', 'Uma semana de consistência. Isso é hábito!');
  if (streak === 30) showWeightCelebration('💎', '30 dias seguidos!', 'Um mês inteiro. Você é imparável!');
}

      Continuar 💪
    </button>`;
  document.body.appendChild(el);
  // Vibração háptica
  if (navigator.vibrate) navigator.vibrate([100, 50, 100, 50, 200]);
}

function initDragSort() {
  const list = document.getElementById('edit-ex-list');
  if (!list) return;
  let dragged = null;
  list.querySelectorAll('.edit-ex-row').forEach(row => {
    row.addEventListener('dragstart', e => { dragged = row; setTimeout(() => row.classList.add('dragging'), 0); e.dataTransfer.effectAllowed = 'move'; });
    row.addEventListener('dragend',   () => { row.classList.remove('dragging'); dragged = null; syncExerciseOrder(); });
    row.addEventListener('dragover',  e => {
      e.preventDefault();
      if (!dragged || dragged === row) return;
      const rect = row.getBoundingClientRect();
      if (e.clientY < rect.top + rect.height / 2) list.insertBefore(dragged, row);
      else list.insertBefore(dragged, row.nextSibling);
    });
  });
}

function syncExerciseOrder() {
  const rows   = document.querySelectorAll('.edit-ex-row');
  const oldExs = [...editorState.exercises];
  editorState.exercises = [];
  rows.forEach(row => {
    const i = parseInt(row.dataset.idx, 10);
    if (!isNaN(i) && oldExs[i]) editorState.exercises.push({ ...oldExs[i] });
  });
  renderPlanEditor();
}

/* Ícones por equipamento */
const EQUIP_ICON = {
  'Máquina':'🦾', 'Cabo':'🔗', 'Halter':'🏋️', 'Barra':'⚡',

function openSubstitutePicker(ei) {
  const wo  = state.activeWorkout;
  const ex  = wo.exercises[ei];
  const grp = getExMuscleGroup(ex);
  const subs = grp ? SUBSTITUTES_DB[grp] || [] : [];

  // Filtra o próprio exercício da lista
  const options = subs.filter(s =>
    s.name.toLowerCase() !== ex.name.toLowerCase()
  );

  const grpLabel = grp ? MUSCLE_GROUPS[grp] : null;

  let body = `
  <div class="sub-current">

    <div class="sub-current-name">${ex.name}</div>
  </div>`;

  if (grpLabel) {
    body += `<div class="sub-group-label">💪 Alternativas — ${grpLabel}</div>`;
  }

  if (!options.length) {
    body += `<div class="sub-none">
      Nenhuma alternativa cadastrada para este exercício.<br>
      Você pode editar o plano e criar suas próprias alternativas.
    </div>`;
  } else {
    body += `<div class="sub-list">`;
    options.forEach((sub, i) => {
      // Carga sugerida: aplica loadFactor sobre a carga atual (média das séries)
      const currentLoad = ex.sets[0]?.load || ex.suggestedLoad;
      const sugLoad = sub.loadFactor !== null
        ? Math.max(2.5, Math.round((currentLoad * sub.loadFactor) / 2.5) * 2.5)
        : null;
      const icon = EQUIP_ICON[sub.equipment] || '🏋️';

      body += `
      <div class="sub-item" onclick="applySubstitute(${ei}, ${i}, '${grp}')">
        <div class="sub-item-icon">${icon}</div>
        <div style="flex:1;min-width:0">
          <div class="sub-item-name">${sub.name}</div>
          <div class="sub-item-meta">
            <span class="sub-equip-badge">${sub.equipment}</span>
          </div>
          <div class="sub-item-tip">${sub.tip}</div>
          ${sugLoad !== null
            ? `<div class="sub-item-load">🎯 Carga sugerida: ${sugLoad}kg</div>`
            : `<div class="sub-item-load" style="background:var(--surface2);border-color:var(--border);color:var(--text-sec)">🎯 Peso corporal / ajustar</div>`
          }
        </div>
      </div>`;
    });
    body += `</div>`;
  }

  body += `<div style="margin-top:18px">
    <p style="font-size:11px;color:var(--text-muted);text-align:center;line-height:1.6">
      A substituição vale só para este treino.<br>O plano original não é alterado.
    </p>
  </div>`;

  openModal('⇄ Trocar Exercício', body);

  // Guarda o índice atual para usar no applySubstitute
  window._subPickerEi = ei;
}

function applySubstitute(ei, subIndex, grp) {
  const wo       = state.activeWorkout;
  const ex       = wo.exercises[ei];
  const subs     = SUBSTITUTES_DB[grp] || [];

  // Filtra igual ao picker
  const currentName = ex.name.toLowerCase();
  const options  = subs.filter(s => s.name.toLowerCase() !== currentName);
  const sub      = options[subIndex];
  if (!sub) return;

  const currentLoad = ex.sets[0]?.load || ex.suggestedLoad;
  const newLoad = sub.loadFactor !== null
    ? Math.max(2.5, Math.round((currentLoad * sub.loadFactor) / 2.5) * 2.5)
    : currentLoad;

  // Salva nome original (para mostrar no card e no histórico)
  if (!ex.originalName) ex.originalName = ex.name;
  ex.substituted   = true;
  ex.name          = sub.name;
  ex.suggestedLoad = newLoad;

  // Reseta as séries com a nova carga (mantém séries e reps alvo)
  ex.sets = ex.sets.map(() => ({ reps:null, load:newLoad, done:false }));

  closeModal();
  renderActiveWorkout();
  toast(`✅ Trocado para: ${sub.name}`);
}

================================================================ */
function getLastSession(planId, history) {
  return [...history].reverse().find(s => s.planId === planId) || null;
}
function getLastSessionId(planId) {
  const s = getLastSession(planId, load().history);
  return s ? s.id : '';
}
function calcStreak(history) {
  if (!history.length) return 0;
  const days = new Set(history.map(s => new Date(s.date).toDateString()));
  let streak = 0;
  const d = new Date();
  while (days.has(d.toDateString())) { streak++; d.setDate(d.getDate() - 1); }
  return streak;
}
function getPrevExData(planId, exerciseId, history) {
  const sessions = [...history].reverse().filter(s => s.planId === planId);
  if (!sessions.length) return null;
  const ex = sessions[0].exercises.find(e => e.exerciseId === exerciseId);
  return ex ? { sets: ex.sets } : null;
}
function buildSuggestion(ex, prev) {
  if (!prev) return null;
  const met   = prev.sets.filter(s => s.reps >= ex.targetReps).length;
  const total = prev.sets.length;
  const step  = loadSettings().progressStep;
  if (met === total)               return `Você bateu a meta! Tente <strong>${(ex.suggestedLoad+step).toFixed(1)}kg</strong> hoje.`;
  if (met >= Math.ceil(total/2))   return `Bom progresso! Mantenha <strong>${ex.suggestedLoad}kg</strong>.`;
  const red = Math.max(step, ex.suggestedLoad - step);
  return `Considere <strong>${red.toFixed(1)}kg</strong> para completar as séries.`;
}
function fmtDur(sec) {
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if (h) return `${h}h ${m}m`;
  if (m) return `${m}m ${s}s`;
  return `${s}s`;
}
function fmtVol(kg) {
  if (kg >= 1000) return (kg/1000).toFixed(1) + 't';
  return Math.round(kg) + 'kg';
}
function fmtDate(iso) {
  return new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' });
}
function fmtDateLong(iso) {
  return new Date(iso).toLocaleDateString('pt-BR', { weekday:'long', day:'2-digit', month:'long' });
}
function esc(str) {
  return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* ================================================================
   18. INIT
================================================================ */
function init() {
  // Header date
  const now  = new Date();
  const days = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const mons = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  document.getElementById('header-date').innerHTML =
    `${days[now.getDay()]}, ${now.getDate()} ${mons[now.getMonth()]}`;

  // Render inicial
  renderDashboard();

  // Cronômetro do treino (atualiza meta a cada segundo)
  setInterval(() => {
    if (state.activeWorkout && state.view === 'workout') {
      const meta = document.getElementById('wo-meta');
      if (meta) {
        const t    = Math.floor((Date.now() - state.activeWorkout.startTime) / 1000);
        const done = state.activeWorkout.exercises.filter(e=>e.completed).length;
        const tot  = state.activeWorkout.exercises.length;
        meta.textContent = `${done}/${tot} exercícios · ${fmtDur(t)}`;
      }
    }
  }, 1000);

  // Agendar notificação se habilitada
  const settings = loadSettings();
  if (settings.notifEnabled && Notification.permission === 'granted') {
    scheduleNotif(settings.notifTime);
  }

  // PWA install prompt (Android/Chrome)
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    window._installPrompt = e;
  });
}

init();
</script>
